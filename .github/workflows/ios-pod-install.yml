name: iOS Pod Install & Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pod_install_and_build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter SDK (stable)
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          export PATH="$HOME/flutter/bin:$PATH"
          flutter --version

      - name: Install CocoaPods
        run: |
          gem install cocoapods

      - name: Flutter pub get
        run: |
          flutter pub get
          flutter precache --ios || true

      - name: Install CocoaPods
        run: |
          gem install cocoapods

      - name: Install iOS pods
        working-directory: ios
        run: |
          # ensure path expected by Podfile exists (some generated files are in ios/Flutter)
          if [ -d "Flutter" ] && [ ! -e "flutter" ]; then
            ln -s Flutter flutter
          fi
          pod repo update || true
          pod install --verbose

      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign
